<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>サカムビット公の逆襲 v3</title>
<style>
  :root {
    --bg: #000;
    --ink: #f4ecd0;
    --dim: #aaa18a;
    --line: #e7dcc0;
    --green: #58ff9a;
    --red: #ff6666;
    --gold: #d9b65f;
    --blue: #60c8ff;
    --panel: rgba(0, 0, 0, 0.9);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: var(--ink);
    font-family: "MS Gothic", "Yu Gothic", "Courier New", monospace;
    letter-spacing: 0;
    touch-action: none;
    user-select: none;
  }

  button {
    min-width: 0;
    color: var(--ink);
    background: #090909;
    border: 1px solid var(--line);
    font: inherit;
    padding: 7px 8px;
    cursor: pointer;
  }

  button:hover, button:focus {
    color: var(--green);
    border-color: var(--green);
    outline: none;
  }

  button:active { transform: translateY(1px); }

  #game {
    width: 100vw;
    height: 100dvh;
    display: grid;
    grid-template-rows: minmax(0, 1fr) 176px;
    background:
      radial-gradient(circle at 50% 12%, rgba(217,182,95,.08), transparent 36%),
      #000;
  }

  #stage {
    position: relative;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 8px;
  }

  #gameCanvas {
    width: min(100%, 960px);
    height: min(100%, 640px);
    aspect-ratio: 3 / 2;
    border: 2px solid var(--line);
    background: #000;
    image-rendering: pixelated;
  }

  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 258px;
    gap: 10px;
    pointer-events: none;
  }

  .panel {
    background: var(--panel);
    border: 2px solid var(--line);
    box-shadow: inset 0 0 0 2px #111;
  }

  #party {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    padding: 7px;
    max-width: 790px;
  }

  .member {
    min-height: 58px;
    border-left: 3px solid var(--blue);
    padding-left: 6px;
    line-height: 1.3;
    font-size: 14px;
  }

  .member.dead { color: #777; border-left-color: #555; }
  .member .name { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member .hp { color: var(--green); }
  .member .bad { color: var(--red); }

  #meta {
    padding: 8px 10px;
    text-align: right;
    line-height: 1.45;
    font-size: 14px;
  }

  #bottom {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 430px;
    gap: 8px;
    padding: 0 8px 8px;
  }

  #message {
    padding: 10px 12px;
    color: var(--green);
    font-size: 16px;
    line-height: 1.45;
    white-space: pre-line;
    overflow: auto;
  }

  #commands {
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    align-content: start;
  }

  #commands button {
    min-height: 36px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #touchControls {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    display: none;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  .touch-dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
    pointer-events: auto;
  }

  .touch-ab {
    display: flex;
    flex-direction: row;
    gap: 12px;
    pointer-events: auto;
    align-items: flex-end;
    padding-bottom: 26px;
  }

  .touch-btn {
    min-height: 52px;
    min-width: 52px;
    padding: 0;
    font-size: 20px;
    background: rgba(0,0,0,.76);
    border-color: rgba(244,236,208,.6);
    border-radius: 8px;
  }

  .touch-btn-a {
    min-height: 60px; min-width: 60px;
    background: rgba(0,50,120,.85);
    border-color: #60c8ff;
    font-weight: bold;
    font-size: 22px;
  }

  .touch-btn-b {
    min-height: 60px; min-width: 60px;
    background: rgba(100,0,0,.85);
    border-color: #ff6666;
    font-weight: bold;
    font-size: 22px;
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    padding: 18px;
    background: rgba(0,0,0,.9);
  }

  #overlay.show { display: grid; }
  #modal {
    width: min(850px, 100%);
    max-height: min(820px, 88dvh);
    overflow: auto;
    padding: 18px;
  }

  #modal h1, #modal h2 { margin: 0 0 12px; color: var(--gold); }
  #modal p { margin: 8px 0; line-height: 1.65; }
  #modal img { width: 100%; max-height: 320px; object-fit: cover; border: 1px solid #333; margin-bottom: 12px; }
  #modal .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .gold { color: var(--gold); }
  .red { color: var(--red); }
  .dim { color: var(--dim); }

  @media (max-width: 820px) {
    #game { grid-template-rows: minmax(0, 1fr) 234px; }
    #stage { align-items: start; padding: 5px; }
    #hud { top: 7px; left: 7px; right: 7px; grid-template-columns: 1fr; gap: 6px; }
    #party { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 5px; gap: 4px; }
    .member { min-height: 45px; font-size: 11px; }
    #meta { text-align: left; font-size: 12px; padding: 6px 8px; }
    #bottom { grid-template-columns: 1fr; gap: 6px; padding: 0 5px 5px; }
    #message { font-size: 13px; padding: 8px; }
    #commands { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; gap: 5px; }
    #commands button { font-size: 11px; min-height: 32px; padding: 4px 2px; }
    #touchControls { display: flex; }
  }
</style>
</head>
<body>
<main id="game">
  <section id="stage" aria-label="迷宮画面">
    <canvas id="gameCanvas" width="960" height="640" tabindex="0"></canvas>
    <div id="hud">
      <div id="party" class="panel"></div>
      <div id="meta" class="panel"></div>
    </div>
    <div id="touchControls" aria-label="タッチ操作">
      <div class="touch-dpad">
        <span></span><button class="touch-btn" data-cmd="forward">▲</button><span></span>
        <button class="touch-btn" data-cmd="left">◀</button><span></span><button class="touch-btn" data-cmd="right">▶</button>
        <span></span><button class="touch-btn" data-cmd="back">▼</button><span></span>
      </div>
      <div class="touch-ab">
        <button class="touch-btn touch-btn-b" data-cmd="btn-b">B</button>
        <button class="touch-btn touch-btn-a" data-cmd="btn-a">A</button>
      </div>
    </div>
  </section>
  <section id="bottom">
    <div id="message" class="panel"></div>
    <div id="commands" class="panel"></div>
  </section>
</main>
<div id="overlay">
  <div id="modal" class="panel"></div>
</div>
<script src="main.js"></script>
</body>
</html>
