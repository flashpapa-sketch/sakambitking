<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>サカムビット公の逆襲 立体版</title>
<style>
  :root {
    --ink: #f1e7cc; --dim: #a99f86; --gold: #d9b65f; --red: #e0503a; --green: #58d98a; --blue: #7fb8ff;
    --panel: rgba(8, 6, 4, .78); --line: rgba(217, 182, 95, .5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", "Noto Serif JP", serif; user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 6px 24px rgba(0,0,0,.5); }
  button { font: inherit; color: var(--ink); background: rgba(20,14,8,.85); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
  button:hover, button.sel { color: #fff6d8; border-color: var(--gold); background: rgba(70,48,18,.9); box-shadow: 0 0 12px rgba(217,182,95,.35); }
  button:disabled { opacity: .4; cursor: default; }
  .hidden { display: none !important; }

  /* 上部の表示 */
  #hudTop { position: fixed; top: 12px; left: 12px; padding: 8px 14px; min-width: 220px; }
  #floorName { font-size: 20px; color: var(--gold); letter-spacing: .08em; }
  #status { font-size: 13px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
  #mapPanel { position: fixed; top: 12px; right: 12px; padding: 6px; cursor: pointer; }
  #map { display: block; width: 190px; height: 190px; image-rendering: pixelated; }
  #mapBig { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.82); z-index: 30; }
  #mapBig canvas { width: min(80vmin, 640px); height: min(80vmin, 640px); image-rendering: pixelated; border: 1px solid var(--line); }

  /* 隊列 */
  #party { position: fixed; left: 12px; right: 12px; bottom: 10px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .pm { padding: 6px 8px 7px; font-size: 13px; line-height: 1.35; position: relative; transition: transform .15s; }
  .pm.hurt { animation: hurt .45s; }
  @keyframes hurt { 0% { transform: translateY(0); background: rgba(140,20,10,.9); } 30% { transform: translateY(-4px); } 100% { transform: none; } }
  .pm .nm { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm .cl { color: var(--dim); font-size: 11px; }
  .pm .st { color: var(--red); font-size: 11px; min-height: 1.3em; }
  .pm.dead { opacity: .45; filter: grayscale(1); }
  .bar { height: 6px; background: #1a0d08; border: 1px solid rgba(217,182,95,.3); margin-top: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #1f6b3a, #58ff9a); transition: width .3s; }
  .bar.low > i { background: linear-gradient(90deg, #8a1a10, #ff6040); }
  .row-tag { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--dim); }

  /* 文章 */
  #msg { position: fixed; left: 50%; transform: translateX(-50%); bottom: 104px; width: min(860px, calc(100% - 24px));
    padding: 12px 20px; font-size: 18px; line-height: 1.75; min-height: 3.5em; max-height: 9.5em; overflow-y: auto; white-space: pre-line; }

  /* 戦闘 */
  #cmd { position: fixed; right: 12px; bottom: 104px; display: grid; gap: 5px; width: 190px; padding: 8px; z-index: 5; }
  #cmd button { text-align: left; }
  #cmd .key { color: var(--dim); font-size: 11px; float: right; margin-top: 3px; }
  #sub { position: fixed; right: 210px; bottom: 104px; display: grid; gap: 5px; width: 230px; padding: 8px; z-index: 5; }
  #foes { position: fixed; inset: 0; pointer-events: none; }
  .foe { position: absolute; transform: translate(-50%, -100%); text-align: center; font-size: 13px; text-shadow: 0 1px 2px #000; min-width: 110px; }
  .foe .bar { width: 110px; margin: 2px auto 0; } .foe .bar > i { background: linear-gradient(90deg, #8a1a10, #ff6040); }
  .foe.tgt .fn::before { content: "▶ "; color: var(--gold); }
  .pop { position: fixed; transform: translate(-50%, 0); font-size: 34px; font-weight: bold; color: #fff2c0; pointer-events: none;
    text-shadow: 0 0 10px #ff8a30, 0 2px 0 #000; z-index: 20; }
  body.inbattle #msg { top: 124px; bottom: auto; max-height: 7.2em; font-size: 16px; width: min(760px, calc(100% - 440px)); }
  #battleTitle { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); padding: 6px 20px; font-size: 20px; letter-spacing: .12em; color: #ffc8b0; z-index: 4; }

  /* 窓（町・宝箱・野営・表題・結末） */
  #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); z-index: 40; }
  #modalBox { width: min(720px, calc(100% - 24px)); max-height: 86vh; overflow-y: auto; padding: 20px 24px; }
  #modalBox h1 { margin: 0 0 8px; color: var(--gold); font-weight: normal; letter-spacing: .12em; font-size: 30px; }
  #modalBox h2 { margin: 0 0 10px; color: var(--gold); font-weight: normal; letter-spacing: .1em; }
  #modalBox p { line-height: 1.8; margin: 8px 0; }
  #modalBox .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #modalBox .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  #modalBox img { width: 100%; max-height: 300px; object-fit: cover; border: 1px solid var(--line); }
  .dim { color: var(--dim); } .gold { color: var(--gold); } .red { color: var(--red); }

  #title { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: #000 center/contain no-repeat; }
  #title .shade { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(0,0,0,.2), rgba(0,0,0,.85)); }
  #title .box { position: relative; text-align: center; padding: 18px 28px; margin-bottom: 7vh; background: rgba(0,0,0,.55); border: 1px solid var(--line); }
  #title h1 { font-size: clamp(22px, 4.2vw, 40px); margin: 0; color: var(--gold); letter-spacing: .14em; font-weight: normal; text-shadow: 0 0 24px rgba(255,160,60,.45), 0 3px 0 #000; }
  #title .sub { margin: 8px 0 22px; color: var(--ink); letter-spacing: .3em; }
  #title .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #title .acts button { min-width: 150px; font-size: 18px; padding: 10px 18px; }
  #title .note { margin-top: 16px; font-size: 13px; color: var(--dim); }

  #toasts { position: fixed; top: 128px; right: 12px; display: grid; gap: 6px; z-index: 60; pointer-events: none; }
  .toast { padding: 8px 16px; font-size: 16px; letter-spacing: .06em; border-width: 1px; border-style: solid; text-shadow: 0 0 10px currentColor; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 1; transition: opacity .8s; z-index: 45; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 3; }

  #help { position: fixed; left: 12px; top: 92px; font-size: 12px; color: var(--dim); line-height: 1.6; padding: 6px 10px; }
  #touch { position: fixed; right: 12px; bottom: 104px; display: none; gap: 6px; grid-template-columns: repeat(3, 54px); z-index: 4; }
  #touch button { height: 54px; padding: 0; font-size: 20px; border-radius: 8px; }

  @media (max-width: 900px), (pointer: coarse) {
    #help { display: none; }
    #touch { display: grid; }
    #party { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; left: 6px; right: 6px; bottom: 6px; }
    .pm { font-size: 11px; padding: 4px 6px; }
    .pm .st { display: none; }
    #msg { bottom: 168px; font-size: 14px; padding: 8px 12px; max-height: 7em; }
    #touch { bottom: 300px; }
    body.inbattle #msg { top: 110px; width: calc(100% - 24px); font-size: 13px; max-height: 6em; }
    #cmd { bottom: 168px; width: 150px; right: 6px; }
    #sub { right: 160px; bottom: 168px; width: 180px; }
    #map { width: 96px; height: 96px; }
    #hudTop { padding: 6px 10px; min-width: 0; max-width: calc(100% - 130px); }
    #floorName { font-size: 15px; } #status { font-size: 11px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="flash"></div>
<div id="foes"></div>
<div id="hudTop" class="panel"><div id="floorName"></div><div id="status"></div></div>
<div id="help" class="panel">W 前進 ／ A・D 向きを変える ／ X 振り返る<br>Z・Enter 調べる・決定・階段 ／ C 野営 ／ M 地図 ／ B 曲 ／ <span style="color:var(--gold)">H 操作一覧</span></div>
<div id="mapPanel" class="panel" title="地図を広げる（M）"><canvas id="map" width="190" height="190"></canvas></div>
<div id="battleTitle" class="panel hidden"></div>
<div id="msg" class="panel"></div>
<div id="cmd" class="panel hidden"></div>
<div id="sub" class="panel hidden"></div>
<div id="party"></div>
<div id="touch">
  <button data-c="camp">野</button><button data-c="forward">▲</button><button data-c="ok">調</button>
  <button data-c="left">◀</button><button data-c="turn">↻</button><button data-c="right">▶</button>
</div>
<div id="mapBig" class="hidden"><canvas id="mapBigC" width="608" height="608"></canvas></div>
<div id="modal" class="hidden"><div id="modalBox" class="panel"></div></div>
<div id="title">
  <div class="shade"></div>
  <div class="box">
    <h1>サカムビット公の逆襲</h1>
    <div class="sub">― 奈落の城デスフォール ―</div>
    <div class="acts">
      <button id="btnNew">新しく始める</button>
      <button id="btnLoad">続きから</button>
    </div>
    <div class="note">音が出ます。　遊びながら H で操作一覧。　<a href="./" style="color:var(--gold)">通常版へ</a></div>
  </div>
</div>
<div id="toasts"></div>
<div id="fade"></div>
<script type="module" src="3d/game.js?v=20261016d"></script>
</body>
</html>
